name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
      - release
  pull_request:
    branches:
      - main
      - development
      - release

jobs:
  build-and-test:
    name: 🧪 Проверка кода и тестов
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Запустить тесты
        run: pytest -v || true

  docs:
    name: 📘 Обновление документации
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success()

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Обновить README.md
        run: |
          echo "✅ Документация обновлена автоматически: $(date)" >> README.md

      - name: Сохранить обновлённую документацию
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: автоматическое обновление документации [skip ci]" || echo "Нет изменений"
          git push

  release:
    name: 🚀 Создание релиза
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/release'

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Создать тег и релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "Release v1.${{ github.run_number }}"
          body: "Автоматически созданный релиз версии v1.${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
