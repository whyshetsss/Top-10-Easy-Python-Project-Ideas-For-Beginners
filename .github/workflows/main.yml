name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
      - release
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 🧪 Run unit tests
        run: |
          pytest -v || exit 1

  generate-docs:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🧰 Install tools
        run: |
          python -m pip install --upgrade pip
          pip install pdoc3

      - name: 📝 Generate documentation
        run: |
          mkdir -p docs
          pdoc calculator.py --output-dir docs || echo "Docs generated"

      - name: 📤 Upload docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-docs
          path: docs/
